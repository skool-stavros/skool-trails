<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKooL-Trails 200 Compact</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=swap" rel="stylesheet">
<style>
:root{--ink:#101828;--paper:#FFFBF0;--amber:#FFC800}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Manrope,sans-serif;background:#FFFBF0}
.bg{position:fixed;inset:0;background:var(--themebg,radial-gradient(120% 100% at 50% 0%,#FFFBF0 0%,#FDF3DC 55%,#F7E8C6 100%));transition:background .35s ease}
.muteBtn{position:fixed;top:12px;right:12px;z-index:50;width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:18px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
.muteBtn.is-muted{background:#eee;opacity:.7}
@media (max-width:480px){.muteBtn{width:36px;height:36px;font-size:15px;top:8px;right:8px}}
.overlay{position:fixed;inset:0;background:radial-gradient(80% 60% at 50% 0%, rgba(255,251,240,0.92) 0%, rgba(255,251,240,0.75) 45%, rgba(255,251,240,0.35) 100%)}
.wrap{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:16px}
.card{background:rgba(255,255,255,0.94);border:3px solid var(--ink);border-radius:24px;padding:20px;box-shadow:8px 8px 0 var(--ink);backdrop-filter:blur(6px)}
.logoBox{text-align:center}.logoBox img{max-width:84%;filter:saturate(1.2)}
h1{font-size:36px;text-align:center;margin:10px 0 16px;text-shadow:2px 2px 0 #fff}
label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;opacity:.7;display:block;margin:12px 0 8px}
select,input{width:100%;padding:14px;border-radius:14px;border:3px solid var(--ink);background:#FFFBF0;color:var(--ink);font-size:15px;text-align:center;font-weight:800}
.btn{border:3px solid var(--ink);border-radius:14px;padding:14px;font-weight:800;cursor:pointer;width:100%;font-size:16px;box-shadow:5px 5px 0 var(--ink)}
.btn:disabled,#contestOpponentSelect:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-y{background:var(--amber)}.btn-g{background:#fff}
.banner{padding:12px;border-radius:12px;border:3px solid var(--ink);font-size:13px;margin-top:12px;font-weight:700}.ok{background:#D8FFE0}.err{background:#FFE0E0}
.kpi{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.kpiChip{flex:1 1 21%;min-width:64px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 6px;text-align:center;box-shadow:4px 4px 0 var(--ink)}
.kpiIcon{font-size:20px;display:block;margin-bottom:2px}
.kpiChip b{font-size:22px;display:block}
.badgeGallery{display:flex;flex-wrap:wrap;gap:12px 10px;margin:14px 0;padding:12px;border:3px solid var(--ink);border-radius:16px;background:#fff}
.badgeGalleryTitle{width:100%;font-size:13px;font-weight:800;letter-spacing:.04em;opacity:.7;margin-bottom:2px}
.badgeItem{display:flex;flex-direction:column;align-items:center;width:42px}
.badge{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;border:2px solid var(--ink)}
.badge.locked{background:#eee;filter:grayscale(1);opacity:.55}
.badge.unlocked{background:var(--theme,#FFC800);box-shadow:2px 2px 0 var(--ink)}
.badgeLvl{font-size:9px;font-weight:800;opacity:.65;margin-top:3px}
.storyList{width:100%;display:flex;flex-direction:column;gap:7px}
.storyRow{display:flex;align-items:flex-start;gap:10px;padding:7px 10px;border-radius:12px}
.storyRow.done{background:#FFFBF0}
.storyRow.next{background:color-mix(in srgb,var(--theme,#FFC800) 20%,#FFFBF0)}
.storyRow.locked{opacity:.4;padding:4px 10px}
.storyIcon{font-size:19px;flex:0 0 24px;text-align:center;line-height:1.4}
.storyRow.locked .storyIcon{font-size:14px}
.storyText{font-size:12.5px;line-height:1.45}
.storyRow.locked .storyText{font-size:11px;font-weight:800;opacity:.7}
.storyName{font-weight:800}
.classTrailCard{margin:14px 0;padding:12px;border:3px solid var(--ink);border-radius:16px;background:#fff}
.classTrailTitle{font-size:13px;font-weight:800;letter-spacing:.04em;opacity:.7;margin-bottom:10px}
.classTrailBar{position:relative;height:34px;background:#f2f2f2;border-radius:18px;border:2px solid var(--ink);margin:4px 8px 18px}
.classDot{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:#aaa;border:2px solid var(--ink);transform:translate(-50%,-50%)}
.classDot.me{width:20px;height:20px;background:var(--theme,#FFC800);z-index:2;box-shadow:0 0 0 3px #fff,2px 2px 0 var(--ink)}
.trailWrap{position:relative;border:3px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:6px 6px 0 var(--ink);height:480px;background:var(--themebg,#b8e6a8)}
.trailScene{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.sceneIcon{position:absolute;opacity:.32;filter:drop-shadow(1px 3px 2px rgba(0,0,0,.15));line-height:1;user-select:none}
@media (max-width:600px){.trailWrap{height:360px}}
.trailBg{position:absolute;inset:0;background:var(--themebg,#b8e6a8);transition:background .35s ease}
#trailSvg{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.extraCard{margin-top:16px}
.contestCard{margin:16px 0;padding:14px;border:4px solid var(--ink);border-radius:18px;background:linear-gradient(135deg,#2D1B69,#5B2C8D);box-shadow:5px 5px 0 var(--ink);color:#fff}
.contestHead h3{margin:0;font-size:19px;color:#fff}
.contestSub{display:block;font-size:12px;font-weight:700;opacity:.85;margin-top:2px}
.btn-purple{background:linear-gradient(135deg,#FF3D9A,#FF7A3D);color:#fff;border:3px solid var(--ink)}
.contestTimerRow{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.contestTimer{font-size:28px;font-weight:800;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:4px 14px;min-width:56px;text-align:center}
.contestTimer.low{background:#FF3D5A;color:#fff;animation:pulse .6s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes glow{0%,100%{box-shadow:5px 5px 0 var(--ink),0 0 0 0 rgba(255,214,0,.6)}50%{box-shadow:5px 5px 0 var(--ink),0 0 18px 6px rgba(255,214,0,.9)}}
.contestProgress{font-size:12px;font-weight:800;opacity:.9}
.contestNotice{margin:8px 0;padding:14px;border:4px solid var(--ink);border-radius:14px;background:linear-gradient(135deg,#FFE347,#FFB800);color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;animation:glow 1.4s infinite;font-weight:800}
.contestNoticeText{flex:1;min-width:180px;font-weight:700;line-height:1.4}
.contestExpiry{display:inline-block;margin-top:4px;font-size:11px;font-weight:800;opacity:.75}
.contestNotice b{font-size:15px}
.contestNotice .btn{border:3px solid var(--ink)}
.contestResult{margin:8px 0;padding:12px;border:3px solid var(--ink);border-radius:14px;color:var(--ink)}
.reviewBox{position:relative;margin-top:10px;padding:14px;border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:4px 4px 0 var(--ink);color:var(--ink)}
.reviewClose{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:#fff;cursor:pointer;font-size:13px;font-weight:800;line-height:1;padding:0}
.reviewTitle{font-weight:800;font-size:14px;margin-bottom:8px;padding-right:30px}
.reviewRow{display:flex;gap:8px;padding:6px 0;border-top:1px solid #eee}
.reviewRow:first-of-type{border-top:none}
.reviewStatus{flex:0 0 20px;font-size:14px}
.reviewBody{flex:1;font-size:12.5px;line-height:1.4}
.reviewQ{font-weight:800}
.reviewPicked{opacity:.8;margin-top:2px}
.reviewCorrect{color:#0a7a3d;margin-top:2px}
.contestResult.win{background:#5CFF8F}
.contestResult.lose{background:#FF7A7A}
.contestResult.draw{background:#FFFBF0}
.contestCard .qChoices .qChoice{color:var(--ink)}
.extraHead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.extraHead h3{margin:0;font-size:15px;letter-spacing:.04em}
.dayBadge{font-size:11px;font-weight:800;opacity:.65}
.btn-q{background:#FFC800}
.btn-q:disabled{background:#EEE;color:#9aa0aa;box-shadow:none;cursor:not-allowed;border-color:#c9ccd2}
.qBox{margin-top:14px;padding:14px;border:3px solid var(--ink);border-radius:16px;background:#fff}
.qLevel{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;opacity:.6;margin-bottom:6px}
.qText{font-size:16px;font-weight:800;margin-bottom:12px;line-height:1.35}
.qChoices{display:grid;gap:8px}
.qChoice{border:3px solid var(--ink);border-radius:12px;padding:10px 12px;font-weight:700;text-align:left;cursor:pointer;background:#FFFBF0;box-shadow:3px 3px 0 var(--ink)}
.qChoice:hover{background:#FFF6D8}
.qChoice.picked-correct{background:#D8FFE0}
.qChoice.picked-wrong{background:#FFE0E0}
.qChoice:disabled{cursor:default;opacity:.85}
.qFeedback{margin-top:10px;font-size:13px}
.themeCard{display:none;margin-top:14px;padding:14px;border:3px solid var(--ink);border-radius:16px;background:var(--themebg,linear-gradient(135deg,color-mix(in srgb,var(--theme,#FFC800) 22%,#FFFBF0),#FFFBF0));box-shadow:3px 3px 0 var(--ink)}
.themeCard.show{display:block}
.themeEmoji{font-size:34px;line-height:1}
.themeName{font-weight:800;font-size:17px;margin-top:4px}
.themeTag{font-size:12px;opacity:.75;margin-top:2px}
.trailWrap{position:relative}
.trailWrap::after{content:"";position:absolute;inset:0;background:var(--theme,transparent);opacity:.16;mix-blend-mode:multiply;pointer-events:none;z-index:1;border-radius:inherit}
.trailWrap::before{content:attr(data-emoji);position:absolute;right:6px;bottom:6px;font-size:64px;opacity:.18;z-index:1;pointer-events:none}
.adventureBanner{display:flex;align-items:center;gap:10px;margin:10px 0;padding:8px 12px;border:3px solid var(--ink);border-radius:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--theme,#FFC800) 20%,#fff),#fff)}
.adventureBanner .emoji{font-size:24px}
.adventureBanner .name{font-weight:800;font-size:14px}
</style>
</head>

<script>
/* ============ AUDIO ENGINE ============
   Background music is the real track you uploaded (game-music.m4a),
   played through a plain <audio> element and looped. The two short
   stingers (bright ascending chime vs low descending buzz) for correct
   and wrong answers are still synthesized live with the Web Audio API --
   no files needed for those, and they're unaffected by this change. */
const AudioEngine=(()=>{
  let ctx=null, masterGain=null;
  let muted=(localStorage.getItem('sk_muted')==='1');
  const bgAudio=document.getElementById('bgMusic');
  if(bgAudio){ bgAudio.volume=0.35; bgAudio.muted=muted; }

  function ensureCtx(){
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return null;
      ctx=new AC();
      masterGain=ctx.createGain();
      masterGain.gain.value=muted?0:0.5;
      masterGain.connect(ctx.destination);
    }
    if(ctx.state==="suspended") ctx.resume();
    return ctx;
  }

  function tone(freq,startOffset,duration,type,gainScale){
    const c=ensureCtx();
    if(!c) return;
    const osc=c.createOscillator();
    const g=c.createGain();
    osc.type=type||"sine";
    osc.frequency.value=freq;
    const t0=c.currentTime+startOffset;
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(0.5*(gainScale||1),t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t0+duration);
    osc.connect(g); g.connect(masterGain);
    osc.start(t0); osc.stop(t0+duration+0.03);
  }

  // fast=true (during a contest round) plays the same track a little
  // quicker/higher for a livelier feel, instead of needing a second
  // music file -- playbackRate resets back to normal afterwards.
  function startMusic(fast){
    if(!bgAudio) return;
    bgAudio.playbackRate=fast?1.15:1.0;
    if(bgAudio.paused) bgAudio.play().catch(()=>{}); // browsers can still
                                                       // reject this before
                                                       // any user gesture
  }
  function stopMusic(){ if(bgAudio){ bgAudio.pause(); } }

  function playCorrect(){
    if(!ensureCtx()) return;
    tone(523.25,0,   0.14,"triangle",1);
    tone(659.25,0.10,0.16,"triangle",1);
    tone(783.99,0.20,0.24,"triangle",1);
  }
  function playWrong(){
    if(!ensureCtx()) return;
    tone(196.00,0,   0.18,"sawtooth",0.6);
    tone(146.83,0.12,0.28,"sawtooth",0.6);
  }

  function setMuted(m){
    muted=m;
    localStorage.setItem('sk_muted', m?'1':'0');
    if(masterGain) masterGain.gain.value=m?0:0.5;
    if(bgAudio) bgAudio.muted=m;
  }
  function isMuted(){ return muted; }

  return {startMusic,stopMusic,playCorrect,playWrong,setMuted,isMuted,ensureCtx};
})();

function updateMuteBtn(){
  const btn=document.getElementById('muteBtn');
  if(!btn) return;
  const m=AudioEngine.isMuted();
  btn.textContent=m?"\ud83d\udd07":"\ud83d\udd0a";
  btn.classList.toggle('is-muted',m);
  btn.setAttribute('aria-label', m?"Unmute music and sounds":"Mute music and sounds");
}
document.getElementById('muteBtn').addEventListener('click',()=>{
  AudioEngine.ensureCtx(); // first click also satisfies the browser's
                            // "needs a user gesture" rule for audio
  const nowMuted=!AudioEngine.isMuted();
  AudioEngine.setMuted(nowMuted);
  if(!nowMuted) AudioEngine.startMusic(false); // resume the track on unmute
  updateMuteBtn();
});
updateMuteBtn();

/* Builds a fresh SVG path string per theme from a handful of numbers
   (amplitude, number of bends, centre-x, style) instead of a hand-
   drawn path -- guarantees valid syntax and safe bounds (x always
   stays within cx +/- amp, capped well inside the 0-420 viewBox) while
   still giving each theme a genuinely different route: 'smooth' gives
   rounded S-curves, 'zigzag' gives sharp angular turns, 'spiral' gives
   a tightening/loosening swirl. Same top-to-bottom span (y 8->858) as
   the original hand-drawn path, so it still reads as one continuous
   mountain-to-sea trail underneath. */
function buildTrailPath({amp=100,n=8,cx=200,style="smooth",spiralDecay=0}){
  const y0=8,y1=858;
  const pts=[];
  for(let i=0;i<=n;i++){
    const t=i/n;
    const y=y0+(y1-y0)*t;
    const a=amp*(1-spiralDecay*t);
    const x=cx+(i%2===0?-a:a);
    pts.push({x,y});
  }
  let d=`M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for(let i=0;i<n;i++){
    const p0=pts[i],p1=pts[i+1];
    if(style==="zigzag"){
      d+=`\nL ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}`;
    }else{
      const midY=((p0.y+p1.y)/2).toFixed(1);
      d+=`\nC ${p0.x.toFixed(1)} ${midY}, ${p1.x.toFixed(1)} ${midY}, ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}`;
    }
  }
  return d;
}
/* Horizontal "switchback" trail: goes left-to-right across a row,
   loops around at the edge, comes back right-to-left, and repeats --
   like a classic board-game level map. Replaces the old tall vertical
   winding path so the map reads wide and short instead of narrow and
   tall. A gentle sine wobble is added within each row so it still
   looks like a hand-drawn trail rather than a ruled line. */
function buildSnakePath({rows=4,width=800,height=480,padX=70,padY=70,wobble=16,turn=46}={}){
  const rowH=rows>1?(height-2*padY)/(rows-1):0;
  const xL=padX,xR=width-padX;
  const pts=[];
  for(let r=0;r<rows;r++){
    const y=padY+rowH*r;
    const leftToRight=r%2===0;
    const xs=leftToRight
      ?[xL,xL+(xR-xL)*0.33,xL+(xR-xL)*0.67,xR]
      :[xR,xR-(xR-xL)*0.33,xR-(xR-xL)*0.67,xL];
    xs.forEach((x,idx)=>{
      const wob=(idx%2===0?-1:1)*wobble;
      pts.push({x,y:y+wob});
    });
    if(r<rows-1){
      const edgeX=leftToRight?xR:xL;
      const bulge=leftToRight?edgeX+turn:edgeX-turn;
      pts.push({x:bulge,y:y+rowH/2});
    }
  }
  let d=`M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i],p1=pts[i+1];
    const midY=((p0.y+p1.y)/2).toFixed(1);
    d+=`\nC ${p0.x.toFixed(1)} ${midY}, ${p1.x.toFixed(1)} ${midY}, ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}`;
  }
  return d;
}
/* Scatters a theme's decorative scenery emoji across the trail
   background at fixed, non-overlapping preset positions -- a
   lightweight stand-in for a hand-illustrated scene per theme. */
function renderScenery(theme){
  const box=document.getElementById('trailScene');
  if(!box) return;
  box.innerHTML='';
  if(!theme||!theme.scenery) return;
  const positions=[[6,10],[86,8],[14,80],[80,78],[46,14],[50,84]];
  theme.scenery.forEach((em,i)=>{
    const pos=positions[i%positions.length];
    const span=document.createElement('div');
    span.className='sceneIcon';
    span.style.left=pos[0]+'%';
    span.style.top=pos[1]+'%';
    span.style.fontSize=(30+(i%3)*10)+'px';
    span.textContent=em;
    box.appendChild(span);
  });
}
function applyTheme(el,classCode){
  const t=THEMES[classCode];
  if(!t) return null;
  el.style.setProperty('--theme',t.accent);
  if(t.bg) el.style.setProperty('--themebg',t.bg);
  return t;
}
function showThemePreview(classCode){
  const box=document.getElementById('themePreview');
  const bg=document.querySelector('.bg');
  const t=THEMES[classCode];
  if(!t){
    box.classList.remove('show');
    // Back to the neutral page background when no class (or an
    // unthemed one) is selected.
    if(bg) bg.style.removeProperty('--themebg');
    return;
  }
  applyTheme(box,classCode);
  // The whole login-screen backdrop switches to the class theme the
  // moment a class is picked -- before the student has typed a
  // password -- not just the small preview card.
  if(bg) applyTheme(bg,classCode);
  document.getElementById('themePreviewEmoji').textContent=t.emoji;
  document.getElementById('themePreviewName').textContent=t.name;
  document.getElementById('themePreviewTag').textContent=t.tag;
  box.classList.add('show');
}

function parseValues(values){
  const students=[];
  for(let r=0;r<values.length;r++){
    const row=values[r].map(v=>String(v||"").trim());
    if(row.length<9) continue;
    let classCode=(row[2]||"").toUpperCase(); if(!CLASS_LIST.includes(classCode)){const alt=(row[1]||"").toUpperCase(); if(CLASS_LIST.includes(alt)) classCode=alt;}
    if(!CLASS_LIST.includes(classCode)) continue;
    // Column D used to be required to look like "EJAB-2" and gated which
    // rows counted as real students. It's now a free-text NICKNAME field
    // instead (shown in contests/etc. instead of real names, for
    // privacy) -- it no longer gates anything. The key check below (a
    // usable code in column I/J) is what decides a row is real data now.
    const nickname=row[3]||"";
    const first=row[4]||""; const last=row[5]||"";
    const marks=parseFloat(String(row[6]||"0").replace(",","."))||0;
    let total=parseFloat(String(row[7]||"0").replace(",","."))||0;
    const tail=row.slice(-10); for(const v of tail){const n=parseFloat(String(v).replace(",",".")); if(!isNaN(n)&&n>0&&n<=300){ if(n>total) total=n; }}
    const colI=(row[8]||"").trim().toUpperCase(); const colJ=(row[9]||"").trim().toUpperCase();
    let key=colI; if(!key||key.length<5) key=colJ; if(!key) continue;
    if(key==="X"||key.startsWith("EJAB-")) continue;
    // The student's unique ID for EVERYTHING (bonus points, contests,
    // class trail, badges) is this key -- column I, the student's code
    // plus their class, confirmed unique per student -- not column D,
    // which is now just a nickname.
    const stuCode=key;
    // School rank (column A) and group rank (column B) -- read as-is; kept
    // blank ("–") if not numeric/empty, since they may be formula-driven
    // and blank for some rows.
    const schoolRank=row[0]&&!isNaN(parseFloat(row[0]))?row[0]:"";
    const groupRank=row[1]&&!isNaN(parseFloat(row[1]))?row[1]:"";
    // Bonus points + last-answered date now live in the sheet itself

    students.push({classCode,stuCode,nickname,first,last,fullName:`${first} ${last}`.trim()||nickname||stuCode,marks,total,key,schoolRank,groupRank,bonus,lastDate});
  }

}

}

const GERMAN_CLASSES=new Set(["DA","DB","DA1","DA2","DB1","DB2"]);
function renderBadgeGallery(theme,eff,classCode){
  const wrap=document.getElementById('badgeGallery');
  if(!wrap) return;
  const isDe=GERMAN_CLASSES.has(classCode);
  const title=isDe?'\ud83d\udcd6 Deine Geschichte bisher...':'\ud83d\udcd6 Your story so far...';
  wrap.innerHTML=`<div class="badgeGalleryTitle">${title}</div><div class="storyList" id="storyList"></div>`;
  const list=document.getElementById('storyList');

  if(!theme||!theme.story){
    // Classes without a themed story yet keep the old simple
    // locked/unlocked badge row so nothing breaks.
    for(let i=1;i<=20;i++){
      const t=i*10;
      const unlocked=eff>=t;
      const item=document.createElement('div');
      item.className='badgeItem';
      const b=document.createElement('div');
      b.className='badge '+(unlocked?'unlocked':'locked');
      b.textContent=unlocked?(theme?theme.emoji:'\u2b50'):'\ud83d\udd12';
      b.title=unlocked?`Level ${i} unlocked!`:`Level ${i} \u2014 reach ${t} points to unlock`;
      item.appendChild(b);
      const lvl=document.createElement('div');
      lvl.className='badgeLvl';
      lvl.textContent=i===20?'SEA':i;
      item.appendChild(lvl);
      list.appendChild(item);
    }
    return;
  }

  let reachedCount=0;
  for(let i=0;i<20;i++){ if(eff>=(i+1)*10) reachedCount=i+1; }

  if(reachedCount===0){
    // Nothing unlocked yet -- point toward the very first milestone.
    const row=document.createElement('div');
    row.className='storyRow next';
    const onWay=isDe
      ?`Du bist auf dem Weg zu ${theme.icons[0]} ${theme.milestones[0]}...`
      :`You are on the way to ${theme.icons[0]} ${theme.milestones[0]}...`;
    row.innerHTML=`<div class="storyIcon">${theme.icons[0]}</div><div class="storyText">${onWay}</div>`;
    list.appendChild(row);
  }else{
    for(let i=0;i<reachedCount;i++){
      let text=theme.story[i];
      if(i===reachedCount-1&&reachedCount<20){
        // Only the most recently completed chapter also points
        // forward to what's next -- earlier chapters stay as plain
        // recap so the log doesn't repeat itself.
        text+=isDe
          ?` Jetzt musst du zu ${theme.icons[i+1]} ${theme.milestones[i+1]}.`
          :` Now you need to head to ${theme.icons[i+1]} ${theme.milestones[i+1]}.`;
      }
      const row=document.createElement('div');
      row.className='storyRow done';
      row.innerHTML=`<div class="storyIcon">${theme.icons[i]}</div><div class="storyText"><span class="storyName">${theme.milestones[i]}.</span> ${text}</div>`;
      list.appendChild(row);
    }
  }

  const lockedStart=reachedCount===0?1:reachedCount+1;
  for(let i=lockedStart;i<=20;i++){
    const row=document.createElement('div');
    row.className='storyRow locked';
    row.innerHTML=`<div class="storyIcon">\ud83d\udd12</div><div class="storyText">Level ${i===20?'SEA':i}</div>`;
    list.appendChild(row);
  }
}

// Shows roughly where every classmate is on the same trail, using data
// already loaded for the whole sheet (ALL) -- no extra network call.

function renderClassTrail(s){
  const wrap=document.getElementById('classTrailBar');
  if(!wrap) return;
  wrap.innerHTML='';
  const classmates=ALL.filter(x=>x.classCode===s.classCode);
  classmates.forEach(x=>{
    const xEff=x.total+(x.bonus||0);
    const pct=Math.max(0,Math.min(xEff,FINISH))/FINISH*100;
    const isMe=x.stuCode===s.stuCode;
    const dot=document.createElement('div');
    dot.className='classDot'+(isMe?' me':'');

    dot.title=(isMe?'You':x.nickname||x.first||'Classmate')+` \u2014 ${xEff.toFixed(1)} pts`;
    wrap.appendChild(dot);
  });
}

/* ============ EXTRA-POINTS DAILY QUESTION ============
   Available every day (no Oct-May limit) -- one attempt per student
   per calendar day. The question is picked using the student's REAL
   class code (from CLASS_LIST / the login, e.g. "EA1", "DB2") -- not
   their points-based trail level, since class code is what actually
   reflects their CEFR level.
   Odd day-of-year = LEXIS question, even day-of-year = GRAMMAR
   question (your rule). Rotation through a class's own questions of
   that type is driven by the day of the year, cycling round again
   once that list is used up.

   THIS IS A STARTER BANK (90 questions: 15 authored class-level
   banks x 3 lexis + 3 grammar), not the full ~7,900-question target
   -- built to prove the mechanism end-to-end with real, correct
   content so you can check quality before we expand it class by
   class. To add more, just append more
   [question, correct, wrong1, wrong2, explain] rows to any
   CLASS_BANKS[code].lexis or .grammar array below -- nothing else
   needs to change.

   EB12 and EC12 don't get their own content bank: they're mixed
   classes (B1+B2 students together, C1+C2 students together), so
   their question pool is simply EB1+EB2 combined and EC1+EC2
   combined (see mergeBanks, right above CLASS_BANKS).

   Level order confirmed by the teacher (lowest -> highest): PJ, JAB,
   A, B, A1, A2, B1, B12, B2, C12. English has all 10 stages; German
   only has classes for A, B, A1, A2, B1, B2 (no PJ/JAB pre-levels,
   no combined B12/C12). DA/DB are built to match EA/EB's actual
   topics (family+numbers, then daily routine) rather than the
   earlier JAB-equivalent/combined guess.

   NOTE ON STORAGE: correct answers ARE now saved back to the Google
   Sheet (columns K/L -- bonus total and last-answered date), via a
   small Apps Script Web App this page POSTs to (see BONUS_WEBAPP_URL
   near SPREADSHEET_ID, and the setup guide). That's the authoritative
   value -- read fresh from the sheet on every page load, so it's
   consistent across every device a student logs in from. If
   BONUS_WEBAPP_URL is left as the placeholder, answers still work but
   nothing gets saved (the feedback message says so). */
const BONUS_POINTS=0.5;
let CURRENT_STUDENT=null;

function buildBank(raw){
  // Stored order doesn't matter -- the real shuffle happens per-render
  // in startExtraQuestion(), so the correct answer's on-screen position
  // is randomised fresh every time a question is shown, not tied to a
  // fixed pattern a student could learn.
  const [q,correct,wrong1,wrong2,explain]=raw;
  return {q,choices:[correct,wrong1,wrong2],correct:0,explain};
}
function bank(lexis,grammar){
  return {
    lexis:lexis.map(buildBank),
    grammar:grammar.map(buildBank)
  };
}
function shuffled(arr){
  const out=arr.slice();
  for(let i=out.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [out[i],out[j]]=[out[j],out[i]];
  }
  return out;
}

// EB12 and EC12 are mixed classes (B1+B2 students together, C1+C2
// students together) rather than levels of their own, so their pool
// is just the combined pool of the two component levels.
function mergeBanks(a,b){ return {lexis:a.lexis.concat(b.lexis), grammar:a.grammar.concat(b.grammar)}; }

// classCode -> bank. Real level order (lowest -> highest), per the
// teacher's correction: PJ, JAB, A, B, A1, A2, B1, B12, B2, C12.
// EA and EB are two distinct sequential levels now (they used to
// wrongly share one bank), and DA/DB are the German equivalents of
// EA/EB's actual topics (family/numbers, then daily routine) rather
// than my earlier guesses.
const CLASS_BANKS={
  EJAB:EJAB_BANK, EA:EA_BANK, EB:EB_BANK, EPJ:EPJ_BANK,
  EA1:EA1_BANK, EA2:EA2_BANK, EB1:EB1_BANK, EB12:EB12_BANK, EB2:EB2_BANK, EC12:mergeBanks(EC1_BANK,EC2_BANK),
  DA:DA_BANK, DB:DB_BANK, DA1:DA1_BANK, DA2:DA2_BANK, DB1:DB1_BANK, DB2:DB2_BANK
};

function dayOfYear(now){
  const start=new Date(now.getFullYear(),0,0);
  return Math.floor((now-start)/86400000);
}
// Classes whose bank is ORDERED to match a real coursebook's teaching
// sequence (e.g. EB follows "The Wonderful Wilsons" unit-by-unit) need
// the day count to start from the school year, not the calendar year,
// so day 1 actually lines up with the first thing taught in class.
// Everything else keeps cycling through its bank by plain day-of-year.
const ORDERED_CLASSES=new Set(["EB","EB1","EJAB","EB12","EA1","EA","DB"]);
function termDayIndex(now){
  const y=now.getFullYear(), m=now.getMonth(); // Jan=0 ... Dec=11
  const start = m>=9 ? new Date(y,9,1) : new Date(y-1,9,1); // Oct 1
  return Math.floor((now-start)/86400000)+1;
}
function dayIndexFor(classCode,now){
  return ORDERED_CLASSES.has(classCode) ? termDayIndex(now) : dayOfYear(now);
}
function dayStamp(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
// Which classmates has this student already challenged in the CURRENT
// rotation? Walks this student's own outgoing challenges in the order
// they were created (CHALLENGES is already oldest-first, since each new
// challenge is appended as a new sheet row) and builds up the set of
// opponents challenged so far -- resetting it the instant it covers the
// whole class, so a full rotation through every classmate automatically
// starts a fresh one. This replaces the old same-day-only check: it's
// strictly stronger (a repeat is blocked until the WHOLE class has been
// challenged, not just until midnight), so nothing else is needed to
// stop an accidental double-challenge either.
function getCycleChallengedSet(s){
  const classmates=ALL.filter(x=>x.classCode===s.classCode&&x.stuCode!==s.stuCode);
  const classSize=classmates.length;
  const set=new Set();
  if(classSize===0) return set;
  for(const c of CHALLENGES){
    if(c.challengerStuCode!==s.stuCode) continue;
    if(!classmates.some(x=>x.stuCode===c.opponentStuCode)) continue; // safety: ignore stale/other-class rows
    set.add(c.opponentStuCode);
    if(set.size>=classSize) set.clear();
  }
  return set;
}

/* Bonus points now live in the spreadsheet itself (see the Apps
   Script + BONUS_WEBAPP_URL setup below), not in this browser's
   localStorage. Reading is free: the normal page-load already pulls
   every student's current bonus/lastDate straight from the sheet via
   the existing gviz fetch. Writing needs an actual network call,
   since a plain static page can't edit a Google Sheet by itself --
   that's what postBonus() below does. */
function postBonus(stuCode,correct,today){
  return postToBackend({action:"dailyBonus",stuCode,correct,today});
}
// Generic write to the Apps Script backend. Same no-cors, fire-and-forget
// pattern as the original daily-bonus write (see comment above) -- we
// can't read a response back, so anything that needs confirming gets
// confirmed by the NEXT gviz read picking up the new sheet state
// (that's why contest results only appear after a fresh page load/login).
function postToBackend(payload){
  if(!BONUS_WEBAPP_URL || BONUS_WEBAPP_URL.indexOf("PASTE_")===0){
    return Promise.resolve({ok:false,error:"not_configured"});
  }
  return fetch(BONUS_WEBAPP_URL,{
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(payload)
  }).then(()=>({ok:true,optimistic:true})).catch(()=>({ok:false,error:"network"}));
}

// Some absolute-beginner classes start with a stretch of lexis-only
// days (no grammar at all) before grammar questions begin -- e.g. EJAB's
// first 20 questions are pure alphabet/vocab, since testing grammar
// before any vocabulary foundation doesn't make sense at that stage.
const LEXIS_ONLY_START={EJAB:20};
function questionTypeFor(dayIndex,classCode){
  const delay=(classCode&&LEXIS_ONLY_START[classCode])||0;
  if(dayIndex<=delay) return "lexis";
  return dayIndex%2===1?"lexis":"grammar";
}
function pickQuestion(classCode,dayIndex){
  const b=CLASS_BANKS[classCode]||EA_BANK;
  const type=questionTypeFor(dayIndex,classCode);
  const arr=b[type];
  return {q:arr[((dayIndex-1)%arr.length+arr.length)%arr.length],type};
}

// --- CONTESTS: pick 10 random questions from material already covered
// ("probably previous ones" -- for classes with a real teaching order,
// only from the portion of the bank reached by today's day-index; for
// other classes, from the whole bank, since there's no "not yet taught"
// boundary for them). Mixes lexis and grammar together.
// Contest question pools are picked freshly at random for every single
// challenge (see pickContestQuestions below) with no memory of what a
// student has already seen, so the same questions absolutely can repeat
// across different challenges -- this review box is what lets a student
// actually learn from a round instead of just seeing a bare score.
function buildAnswerReviewHTML(answerLog){
  const rows=answerLog.map((a,i)=>{
    const status=a.picked===null?"\u23f1\ufe0f":(a.correct?"\u2705":"\u274c");
    const pickedText=a.picked===null?"<i>No answer \u2014 ran out of time</i>":a.picked;
    const extra=a.correct?"":`<div class="reviewCorrect">Correct answer: <b>${a.correctText}</b></div>`;
    return `<div class="reviewRow"><div class="reviewStatus">${status}</div><div class="reviewBody"><div class="reviewQ">${i+1}. ${a.q}</div><div class="reviewPicked">Your answer: ${pickedText}</div>${extra}</div></div>`;
  }).join("");
  return `<div class="reviewBox"><button type="button" class="reviewClose" aria-label="Close">\u2715</button><div class="reviewTitle">Your answers</div>${rows}</div>`;
}
function attachReviewUI(box,answerLog){
  const toggleBtn=document.createElement('button');
  toggleBtn.type="button"; toggleBtn.className="btn btn-y"; toggleBtn.style.marginTop="8px";
  toggleBtn.textContent="\ud83d\udccb Review your answers";
  const reviewDiv=document.createElement('div');
  reviewDiv.style.display="none";
  reviewDiv.innerHTML=buildAnswerReviewHTML(answerLog);
  toggleBtn.onclick=()=>{ reviewDiv.style.display=reviewDiv.style.display==="none"?"block":"none"; };
  reviewDiv.querySelector('.reviewClose').onclick=()=>{ reviewDiv.style.display="none"; };
  box.appendChild(toggleBtn);
  box.appendChild(reviewDiv);
}
function pickContestQuestions(classCode){
  const b=CLASS_BANKS[classCode]||EA_BANK;
  const now=new Date();
  const dayIndex=dayIndexFor(classCode,now);
  const pool=[];
  if(ORDERED_CLASSES.has(classCode)){
    pool.push(...b.lexis.slice(0,Math.max(1,Math.min(b.lexis.length,dayIndex))));
    pool.push(...b.grammar.slice(0,Math.max(1,Math.min(b.grammar.length,dayIndex))));
  }else{
    pool.push(...b.lexis, ...b.grammar);
  }
  const chosen=shuffled(pool).slice(0,Math.min(10,pool.length));
  // Freeze each one as a plain {q,choices,correct,explain} snapshot --
  // this is what gets stored in the sheet, so both players see the exact
  // same questions even if the live bank changes later.
  return chosen.map(item=>({q:item.q,choices:item.choices.slice(),correct:item.correct,explain:item.explain}));
}

// --- CONTESTS: shared 30-second, 10-question speed round. Used both by
// the challenger (playing first) and the opponent (playing the SAME
// frozen question set later). onDone(score) fires exactly once, either
// when all questions are answered or when the clock runs out.
let CONTEST_TIMER_HANDLE=null;
function currentLevelFor(s){ return Math.max(1,Math.min(20,Math.floor(Math.min(s.total+(s.bonus||0),FINISH)/10))); }

function runContestRound(questions,onDone){
  const roundBox=document.getElementById('contestRoundBox');
  const pickerWrap=document.getElementById('contestPickerWrap');
  const timerEl=document.getElementById('contestTimer');
  const progEl=document.getElementById('contestProgress');
  const qText=document.getElementById('contestQText');
  const qChoices=document.getElementById('contestQChoices');
  pickerWrap.style.display="none";
  roundBox.style.display="block";
  document.getElementById('contestResultBox').innerHTML="";
  AudioEngine.startMusic(true); // faster tempo during the timed round

  let idx=0, score=0, finished=false;
  let secondsLeft=30;
  timerEl.textContent=secondsLeft;
  timerEl.classList.remove('low');
  // One entry per question, for the "review your answers" box after the
  // round -- questions run out of time still get logged as unanswered.
  const answerLog=questions.map(q=>({q:q.q,picked:null,correct:false,correctText:q.choices[q.correct],explain:q.explain||""}));

  function finish(){
    if(finished) return;
    finished=true;
    clearInterval(CONTEST_TIMER_HANDLE);
    AudioEngine.startMusic(false); // back to the normal ambient tempo
    roundBox.style.display="none";
    document.getElementById('contestPickerWrap').style.display="block";
    onDone(score,answerLog);
  }

  function showQuestion(){
    if(idx>=questions.length){ finish(); return; }
    const q=questions[idx];
    progEl.textContent=`Question ${idx+1} / ${questions.length}`;
    qText.textContent=q.q;
    qChoices.innerHTML="";
    const order=shuffled(q.choices.map((text,i)=>({text,correct:i===q.correct})));
    order.forEach(item=>{
      const b=document.createElement('button');
      b.type="button"; b.className="qChoice"; b.textContent=item.text;
      b.onclick=()=>{
        item.correct?AudioEngine.playCorrect():AudioEngine.playWrong();
        answerLog[idx].picked=item.text;
        answerLog[idx].correct=item.correct;
        if(item.correct) score++;
        idx++;
        showQuestion();
      };
      qChoices.appendChild(b);
    });
  }

  CONTEST_TIMER_HANDLE=setInterval(()=>{
    secondsLeft--;
    timerEl.textContent=Math.max(0,secondsLeft);
    if(secondsLeft<=10) timerEl.classList.add('low');
    if(secondsLeft<=0) finish();
  },1000);

  showQuestion();
}

function renderContestSection(s){
  const wrap=document.getElementById('contestOpponentSelect');
  const startBtn=document.getElementById('contestStartBtn');
  if(!wrap) return;
  wrap.innerHTML='<option value="" disabled selected>Choose a classmate</option>';
  // Everyone in the class always appears in the list -- nobody gets
  // hidden -- but anyone already challenged in the current rotation is
  // shown faded and un-clickable (a plain disabled <option>), with a
  // checkmark so it's clear *why*. Once every classmate has been
  // challenged, getCycleChallengedSet() resets on its own and the very
  // next render shows the whole list enabled again.
  const classmates=ALL.filter(x=>x.classCode===s.classCode&&x.stuCode!==s.stuCode);
  const challengedThisRound=getCycleChallengedSet(s);
  classmates.forEach(x=>{
    const o=document.createElement('option');
    o.value=x.stuCode;
    const done=challengedThisRound.has(x.stuCode);
    o.textContent=(x.nickname||x.fullName)+(done?" \u2713 challenged":"");
    o.disabled=done;
    wrap.appendChild(o);
  });
  wrap.disabled=classmates.length===0;
  if(startBtn) startBtn.disabled=classmates.length===0;
  // Reset every piece of contest UI to a clean state on every fresh
  // render -- without this, logging in as a different student in the
  // SAME browser tab (no full page reload) leaves the previous
  // student's leftover result/round content on screen, wrongly
  // attributed to whoever's now logged in.
  const resultBox=document.getElementById('contestResultBox');
  if(resultBox) resultBox.innerHTML="";
  const roundBox=document.getElementById('contestRoundBox');
  if(roundBox) roundBox.style.display="none";
  const pickerWrap=document.getElementById('contestPickerWrap');
  if(pickerWrap) pickerWrap.style.display="block";
  const picker=document.getElementById('contestPicker');
  if(picker) picker.style.display="none";
  if(CONTEST_TIMER_HANDLE){ clearInterval(CONTEST_TIMER_HANDLE); CONTEST_TIMER_HANDLE=null; }

  renderContestNotices(s);
}

function formatDate(iso){
  const parts=(iso||"").split("-");
  if(parts.length!==3) return iso||"";
  const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const m=parseInt(parts[1],10)-1;
  return `${parseInt(parts[2],10)} ${months[m]||parts[1]} ${parts[0]}`;
}

function renderContestNotices(s){
  const box=document.getElementById('contestNotices');
  if(!box) return;
  box.innerHTML="";
  const todayStr=dayStamp(new Date());
  // Temporary diagnostic -- open the browser's Console (see the debug
  // guide) to see exactly what got loaded, so a mismatch (wrong date,
  // wrong student code, sheet not loading at all) is visible instead
  // of a silent "nothing shows up".
  console.log('[Contest debug] CHALLENGES loaded:', CHALLENGES ? CHALLENGES.length : 0, 'rows. My stuCode:', s.stuCode, '| Today:', todayStr);
  if(CHALLENGES && CHALLENGES.length){
    CHALLENGES.forEach((c,i)=>console.log('[Contest debug] row', i, '-> opponentStuCode:', JSON.stringify(c.opponentStuCode), 'status:', JSON.stringify(c.status), 'date:', JSON.stringify(c.date)));
  }
  if(!CHALLENGES||!CHALLENGES.length) return;

  // Incoming challenges waiting for ME to play -- a challenge is only
  // ever valid on the day it was created (the "expires on" date shown
  // to the student). Once the calendar day rolls over, it's excluded
  // here entirely, so an unanswered challenge quietly stops appearing
  // instead of nagging forever.
  CHALLENGES.filter(c=>c.status==="pending" && c.opponentStuCode===s.stuCode && c.date===todayStr).forEach(c=>{
    const div=document.createElement('div');
    div.className="contestNotice";
    div.style.cursor="pointer";
    div.innerHTML=`<div class="contestNoticeText"><b>${c.challengerName||"A classmate"}</b> sent you a challenge! They scored <b>${c.challengerScore}/10</b>. Now it's your turn.<br><span class="contestExpiry">This challenge expires on ${formatDate(c.date)}.</span></div>`;
    const btn=document.createElement('button');
    btn.className="btn btn-purple"; btn.style.width="auto"; btn.style.padding="10px 16px"; btn.style.fontSize="13px"; btn.type="button";
    btn.textContent="Play Now \u2192";
    div.appendChild(btn);
    const play=(e)=>{ e.stopPropagation(); acceptChallenge(s,c); };
    btn.onclick=play;
    div.onclick=()=>acceptChallenge(s,c);
    box.appendChild(div);
  });

  // Completed contests involving me, most recent first.
  CHALLENGES.filter(c=>c.status==="completed" && (c.challengerStuCode===s.stuCode||c.opponentStuCode===s.stuCode))
    .slice(-5).reverse().forEach(c=>{
      const isChallenger=c.challengerStuCode===s.stuCode;
      const myScore=isChallenger?c.challengerScore:c.opponentScore;
      const oppScore=isChallenger?c.opponentScore:c.challengerScore;
      const oppName=isChallenger?c.opponentName:c.challengerName;
      const draw=c.winnerStuCode==="" || c.winnerStuCode==null;
      const won=!draw && c.winnerStuCode===s.stuCode;
      const div=document.createElement('div');
      div.className="contestResult "+(draw?"draw":won?"win":"lose");
      const pts=c.pointsTransferred||0;
      const verb=draw?"Draw":won?"You won":"You lost";
      const ptsText=draw?"No points either way.":won?`+${pts.toFixed(2)} pts`:"No points lost \u2014 only winners earn points!";
      div.innerHTML=`<b>${verb} vs ${oppName||"a classmate"}</b> (${myScore}/10 \u2013 ${oppScore}/10) \u2014 ${ptsText}`;
      box.appendChild(div);
    });
}

function beginChallenge(s){
  const opponentStuCode=document.getElementById('contestOpponentSelect').value;
  if(!opponentStuCode) return;
  const opponent=ALL.find(x=>x.stuCode===opponentStuCode);
  if(!opponent) return;
  // Belt-and-braces check even though the dropdown already disables
  // already-challenged-this-rotation classmates -- catches a stale
  // selection from a fast double-click before the UI re-renders.
  if(getCycleChallengedSet(s).has(opponentStuCode)){
    renderContestSection(s);
    const box=document.getElementById('contestResultBox');
    box.innerHTML=`<div class="contestResult draw">You've already challenged <b>${opponent.nickname||opponent.fullName}</b> this round \u2014 challenge someone else first, then they'll be available again!</div>`;
    return;
  }
  const questions=pickContestQuestions(s.classCode);
  runContestRound(questions,(score,answerLog)=>{
    const challengeId="C"+Date.now()+"_"+Math.floor(Math.random()*1e6);
    postToBackend({
      action:"createChallenge",
      challengeId, classCode:s.classCode, today:dayStamp(new Date()),
      challengerStuCode:s.stuCode, challengerName:s.nickname||s.fullName, challengerLevel:currentLevelFor(s), challengerScore:score,
      opponentStuCode:opponent.stuCode, opponentName:opponent.nickname||opponent.fullName,
      questions:JSON.stringify(questions)
    });
    const box=document.getElementById('contestResultBox');
    box.innerHTML=`<div class="contestResult draw">Challenge sent to <b>${opponent.nickname||opponent.fullName}</b>! You scored ${score}/10. They'll see it next time they log in.</div>`;
    attachReviewUI(box,answerLog);
  });
}

function acceptChallenge(s,challenge){
  let questions;
  try{ questions=JSON.parse(challenge.questionsJSON); }catch(e){ questions=null; }
  if(!questions || !questions.length) return;
  runContestRound(questions,(score,answerLog)=>{
    postToBackend({
      action:"submitChallengeResult",
      challengeId:challenge.id,
      opponentScore:score,
      opponentLevel:currentLevelFor(s)
    });
    // Mark it completed in our own copy of the data immediately --
    // "challenge" is the same object sitting in the CHALLENGES array,
    // so this stops it from being replayable (and re-scored a second
    // time) if the screen re-renders later in this session, e.g. after
    // answering the daily question.
    challenge.status="completed";
    challenge.opponentScore=score;
    challenge.opponentLevel=currentLevelFor(s);
    const won=score>challenge.challengerScore, draw=score===challenge.challengerScore;
    const box=document.getElementById('contestResultBox');
    box.innerHTML=`<div class="contestResult ${draw?'draw':won?'win':'lose'}">You scored ${score}/10 vs ${challenge.challengerName}'s ${challenge.challengerScore}/10. ${draw?"It's a draw \u2014 no points either way.":won?"You won! Your bonus points will show once the sheet updates.":"You lost this one, but you don't lose any points \u2014 only winners earn points!"}</div>`;
    attachReviewUI(box,answerLog);
  });
}

function renderExtraSection(s){
  const btn=document.getElementById('extraBtn');
  const badge=document.getElementById('termBadge');
  const statusEl=document.getElementById('extraStatus');
  document.getElementById('qBox').style.display="none";
  statusEl.innerHTML="";
  btn.style.display="block";

  const now=new Date();
  const dayIndex=dayIndexFor(s.classCode,now);
  const type=questionTypeFor(dayIndex,s.classCode);
  badge.textContent=`Day ${dayIndex} \u2022 ${type==="lexis"?"Lexis":"Grammar"} day \u2022 ${s.classCode}`;

  if(s.lastDate===dayStamp(now)){
    btn.disabled=true;
    btn.textContent=s.lastCorrect?"\u2705 Done for today \u2014 see you tomorrow!":"Come back tomorrow for another question";
    statusEl.innerHTML=s.lastCorrect
      ?`<div class="banner ok">Nice! You already earned +${BONUS_POINTS} pt today.</div>`
      :`<div class="banner err">You already tried today's question. A new one unlocks tomorrow.</div>`;
    return;
  }
  btn.disabled=false;
  btn.textContent="Get today's question";
}

function startExtraQuestion(){
  if(!CURRENT_STUDENT) return;
  const now=new Date();
  const dayIndex=dayIndexFor(CURRENT_STUDENT.classCode,now);
  const {q,type}=pickQuestion(CURRENT_STUDENT.classCode,dayIndex);

  document.getElementById('extraBtn').style.display="none";
  document.getElementById('extraStatus').innerHTML="";
  const qBox=document.getElementById('qBox');
  qBox.style.display="block";
  document.getElementById('qLevel').textContent=`${CURRENT_STUDENT.classCode} \u2022 ${type==="lexis"?"Lexis":"Grammar"} question`;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('qFeedback').innerHTML="";
  const cWrap=document.getElementById('qChoices');
  cWrap.innerHTML="";
  // Shuffle choice order freshly on every render -- the correct answer
  // is never in a fixed/predictable slot.
  const order=shuffled(q.choices.map((text,idx)=>({text,correct:idx===q.correct})));
  order.forEach((item,i)=>{
    const b=document.createElement('button');
    b.type="button"; b.className="qChoice"; b.textContent=item.text;
    b.onclick=()=>answerExtraQuestion(i,order,q,cWrap);
    cWrap.appendChild(b);
  });
}

function answerExtraQuestion(i,order,q,cWrap){
  const buttons=[...cWrap.querySelectorAll('button')];
  buttons.forEach((b,idx)=>{
    b.disabled=true;
    if(order[idx].correct) b.classList.add("picked-correct");
    else if(idx===i) b.classList.add("picked-wrong");
  });
  const correct=order[i].correct;
  const today=dayStamp(new Date());
  correct?AudioEngine.playCorrect():AudioEngine.playWrong();

  const fb=document.getElementById('qFeedback');
  fb.innerHTML=`<div class="banner ${correct?'ok':'err'}">${correct?'\u2713 Correct!':'\u2717 Not quite.'} Saving\u2026</div>`;

  postBonus(CURRENT_STUDENT.stuCode,correct,today).then(res=>{
    if(res && res.ok){
      if(res.optimistic){
        // no-cors response can't be read, so we can't get the server's
        // true running total back -- apply the point ourselves and let
        // the next fresh login reconcile against the real sheet value.
        CURRENT_STUDENT.bonus=(CURRENT_STUDENT.bonus||0)+(correct?BONUS_POINTS:0);
      }else{
        CURRENT_STUDENT.bonus=res.bonus;
      }
      CURRENT_STUDENT.lastDate=today;
      CURRENT_STUDENT.lastCorrect=correct;
      fb.innerHTML=correct
        ? `<div class="banner ok">\u2713 Correct! +${BONUS_POINTS} pt saved. ${q.explain||""}</div>`
        : `<div class="banner err">\u2717 Not quite. ${q.explain||""}</div>`;
      renderTrail(CURRENT_STUDENT,true); // refresh points/trail only, keep this feedback visible
    }else{
      const reason=res&&res.error==="not_configured"
        ? "the bonus-saving backend isn't set up yet"
        : "of a connection problem";
      fb.innerHTML=`<div class="banner err">${correct?'\u2713 Correct, but':'\u2717 Not saved \u2014'} this couldn't be saved because ${reason}. ${q.explain||""}</div>`;
    }
  });
}
document.getElementById('extraBtn').onclick=startExtraQuestion;
document.getElementById('contestChallengeBtn').onclick=()=>{
  document.getElementById('contestPicker').style.display="block";
};
document.getElementById('contestStartBtn').onclick=()=>{
  if(CURRENT_STUDENT) beginChallenge(CURRENT_STUDENT);
};

async function init(){
  const sel=document.getElementById('classSel');
  CLASS_LIST.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);});
  sel.onchange=()=>showThemePreview(sel.value);
  try{const gviz=await loadGviz(GID); const vals=gvizToValues(gviz); ALL=parseValues(vals); if(ALL.length>0) setStatus(`✓ Live • ${ALL.length} students • 200 pts • Mountains to Sea`,"ok");}catch(e){setStatus("Failed to load","err");}
  CHALLENGES=await loadChallenges();
}
document.getElementById('loginBtn').onclick=()=>{
  const sel=document.getElementById('classSel'); const cls=sel.value; const pwd=document.getElementById('pwd').value.trim().toUpperCase();
  if(!cls){setStatus("Please choose your class from the list.","err"); return;}
  if(!pwd){setStatus("Your password should be 3-4 digits and 3 CAPITAL letters.","err"); return;}
  if(!/^[0-9]{3,4}[A-Z]{3,}/.test(pwd)){ setStatus("Your password should be 3-4 digits and 3 CAPITAL letters.","err"); return; }
  const lookup=`${pwd}${cls}`.toUpperCase();
  let f=ALL.find(s=>s.key===lookup)||ALL.find(s=>s.key===pwd)||ALL.find(s=>s.key.startsWith(pwd)&&s.classCode===cls);
  if(!f){
    // Student-facing message is always the same simple line. The real
    // reason (for the teacher's own debugging) still goes to the
    // console, never to the on-screen box a student can see.
    const inClass=ALL.filter(s=>s.classCode===cls).length;
    if(ALL.length===0){
      setStatus("Student data hasn't loaded yet — wait a moment and try again.","err");
    }else{
      if(inClass===0){
        console.log(`Login diagnostic: no students loaded for class ${cls} (0 rows with that class code in the sheet).`);
      }else{
        console.log(`Login diagnostic: found ${inClass} student(s) in ${cls}, but none matched that key.`);
      }
      setStatus("Incorrect credentials. Access denied. Check your password.","err");
    }
    return;
  }
  renderTrail(f);
};
document.getElementById('logoutBtn').onclick=()=>{document.getElementById('trailCard').style.display="none"; document.getElementById('loginCard').style.display="block"; document.getElementById('pwd').value=""; CURRENT_STUDENT=null;};
init();
</script>
